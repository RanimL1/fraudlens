[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens"
version = "0.1.0"
description = "Détection de fraude explicable avec tableau de bord d'investigation"
requires-python = ">=3.10"
dependencies = [
  "pandas", "numpy", "pyarrow", "scikit-learn",
  "lightgbm", "mlflow", "pyyaml", "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]